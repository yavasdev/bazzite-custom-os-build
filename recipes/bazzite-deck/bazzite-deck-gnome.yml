---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bazzite-deck-gnome-tuxedo
description: Bazzite Deck Gnome with Tuxedo drivers and Control Center.

alt-tags:
  - latest
  - stable

base-image: ghcr.io/ublue-os/bazzite-deck-gnome
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /
  
  - type: rpm-ostree
    install:
      - git
      - make
      - gcc
      - kmod
      - curl
      - wget
      - cpio
      - kernel-devel
      - kernel-devel-matched

  - type: script
    scripts:
      - build-tuxedo.sh

  - type: systemd
    system:
      enabled:
        - tccd.service

  - type: signing
