---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: bazzite-gdx-tuxedo
description: Bazzite GDX with Tuxedo drivers and Control Center.

alt-tags:
  - latest
  #- stable
# note: this image is in still testing phase, use it at your own risk. It is not yet considered stable.
base-image: ghcr.io/ublue-os/bazzite-gdx
image-version: latest # stable

modules:
  - type: files
    files:
      - source: system
        destination: /
  
  - type: dnf
    install:
      packages:
        - git
        - make
        - gcc
        - kmod
        - curl
        - wget
        - cpio
        - kernel-devel

  - type: script
    scripts:
      - build-tuxedo.sh

  - type: systemd
    system:
      enabled:
        - tccd.service

  - type: signing
