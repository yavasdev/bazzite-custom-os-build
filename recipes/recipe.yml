---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: bazzite-dx-nvidia_with-tuxedo-drivers
# Add alt tags alongside the latest tag.
alt-tags:
  - stable-44
# description will be included in the image's metadata
description: Custom Bazzite DX Nvidia with Tuxedo Drivers.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx-nvidia
# You can pin to a specific version of Fedora as well
image-version: stable-44 

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        # copies files/system/* (* means everything inside it) into your image's root folder /
        destination: /
  
  # adding rpm-ostree repos
  - type: rpm-ostree
    repos:
      # tuxedo drivers repo
      - https://copr.fedorainfracloud.org/coprs/darrencocco/tuxedo-drivers-kmod/repo/fedora-44/darrencocco-tuxedo-drivers-kmod-fedora-44.repo
      - https://raw.githubusercontent.com/yavasdev/bazzite-custom-os-build/main/files/system/etc/yum.repos.d/tuxedo.repo
    install:
      - tuxedo-drivers-kmod
      - tuxedo-control-center
      - android-tools
      - protobuf
      - waydroid-helper

  - type: systemd
    system:
      enabled:
        - tuxedotccd.service

  # protects the bazzite's default flatpak settings.
  - type: default-flatpaks
  # this sets up the proper policy & signing files for signed images to work fully
  - type: signing

