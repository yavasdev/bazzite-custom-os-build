name: Update README with Template Variables

# When will this workflow run?
on:
  push:
    paths:
      - 'README.template.md'
      - 'docs/README-TR.template.md'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  update-readme:
    name: Generate and Push README
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write permission required to push to the repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate READMEs from templates
        run: bash files/scripts/generate-readmes.sh

      - name: Commit and push READMEs
        run: |
          # Add both generated files to the Git staging area
          git add README.md docs/README-TR.md
          
          # Check if there are any actual changes
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: generate README and README-TR with updated variables"
          
          git push origin "HEAD:${GITHUB_REF_NAME}"