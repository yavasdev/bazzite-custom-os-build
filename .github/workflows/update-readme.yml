name: Update README with Template Variables

# When will this workflow run?
on:
  push:
    paths:
      - 'README.template.md'
      - 'docs/README-TR.template.md'
      - '.github/workflows/update-readme.yml'
      - 'files/scripts/generate-readmes.sh'
      - 'files/scripts/git-check-and-push.sh'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  update-readme:
    name: Generate and Push README
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write permission required to push to the repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate READMEs from templates
        run: bash files/scripts/generate-readmes.sh

      - name: add generated files to git
        run: |
          # Add generated files to the Git staging area
          echo "Adding generated README files to git..."
          git add README.md docs/README-TR.md 
          echo "Files added to git staging area."
        
      - name: Commit and push changes
        run: |
          bash files/scripts/git-check-and-push.sh
