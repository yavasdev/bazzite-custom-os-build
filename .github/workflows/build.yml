name: Build Bazzite Tuxedo Images
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - main
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"
      - "docs/**.md"

  pull_request:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"
      - "docs/**.md"
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  recipes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find-recipes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - id: find-recipes
        run: |
          recipes=$(find recipes -maxdepth 3 -type f -name '*.yml' ! -name 'recipe-example.yml' ! -empty -printf '%P\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"recipe\":$recipes}" >> "$GITHUB_OUTPUT"

  bluebuild:
    needs: recipes
    name: bluebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      # use the matrix output from the previous job to build all recipes in parallel
      matrix: ${{ fromJSON(needs.recipes.outputs.matrix) }}
    steps:
      # the build is fully handled by the reusable github action
      - name: steps
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
  
  build-success:
    name: build-success
    if: always()
    needs:
      - recipes
      - bluebuild
    runs-on: ubuntu-latest
    steps:
      - name: Verify build result
        env:
          RECIPES_RESULT: ${{ needs.recipes.result }}
          BLUEBUILD_RESULT: ${{ needs.bluebuild.result }}
        run: |
          test "$RECIPES_RESULT" = "success"
          test "$BLUEBUILD_RESULT" = "success"

  dependabot:
    name: dependabot auto-merge
    needs: build-success
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        needs.build-success.result == 'success'
      }}
    steps:
      - name: "Merge Dependabot Pull Request automatically"
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}