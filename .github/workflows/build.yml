name: Build Bazzite Tuxedo Images
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    branches:
      - main
    paths-ignore: # don't rebuild if only documentation and workflows have changed
      - "**.md"
      - "docs/**.md"
      - "docs/tests/**/*"

  pull_request:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"
      - "docs/**.md"
      - "docs/tests/**/*"
  workflow_dispatch: # allow manually triggering builds

concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  recipes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find-recipes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - id: find-recipes
        run: |
          recipes=$(find recipes -maxdepth 3 -type f -name '*.yml' ! -name 'recipe-example.yml' ! -empty -printf '%P\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix={\"recipe\":$recipes}" >> "$GITHUB_OUTPUT"

  bluebuild:
    needs: recipes
    name: bluebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      # use the matrix output from the previous job to build all recipes in parallel
      matrix: ${{ fromJSON(needs.recipes.outputs.matrix) }}
    steps:
      # the build is fully handled by the reusable github action
      - name: steps
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
  
  build-success:
    name: build-success
    if: always()
    needs:
      - recipes
      - bluebuild
    runs-on: ubuntu-latest
    steps:
      - name: Verify build result
        env:
          RECIPES_RESULT: ${{ needs.recipes.result }}
          BLUEBUILD_RESULT: ${{ needs.bluebuild.result }}
        run: |
          test "$RECIPES_RESULT" = "success"
          test "$BLUEBUILD_RESULT" = "success"

  update-image-badges:
    name: update image badges
#    if: github.event_name != 'pull_request'
    needs: build-success
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Generate image version badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p badges
          find badges -type f -name '*.json' -delete

          while IFS= read -r recipe; do
            image=$(sed -n 's/^name: *//p' "$recipe")
            [ -n "$image" ] || continue

            configured=$(grep -hE '^[[:space:]]+- (stable|testing|latest)$' "$recipe" |
              sed 's/^[[:space:]]*- //' | sort -u | tr '\n' ' ')
            while IFS= read -r channel; do
              if [[ " $configured " != *" $channel "* ]]; then
                version="not configured"
                color="lightgrey"
              else
                versions=$(gh api --paginate \
                  "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${image}/versions?per_page=100" \
                  --jq '.[]' 2>/dev/null | jq -s '.' || printf '[]')
              version=$(jq -r --arg channel "$channel" '
                [.[] | select(.metadata.container.tags != null)
                | select(any(.metadata.container.tags[]; . == $channel or startswith($channel + "-")))]
                | sort_by(.created_at) | last
                | if . == null then empty
                  else ([.metadata.container.tags[] | select(. == $channel or startswith($channel + "-"))] | first)
                    + " · " + (.created_at | split("T")[0])
                  end
              ' <<<"$versions")

              if [ -z "$version" ]; then
                version="not published"
                color="lightgrey"
              else
                color="brightgreen"
              fi
              fi

              jq -n \
                --arg label "$channel" \
                --arg message "$version" \
                --arg color "$color" \
                '{schemaVersion: 1, label: $label, message: $message, color: $color}' \
                > "badges/${image}-${channel}.json"
            done < <(printf '%s\n' stable testing latest)
          done < <(find recipes -maxdepth 3 -type f -name '*.yml' ! -name 'recipe-example.yml' ! -empty | sort)

      - name: Commit image badges
        run: |
          if git diff --quiet -- badges; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges
          git commit -m "docs: update image version badges"
          git push origin HEAD:main

  dependabot:
    name: dependabot auto-merge
    needs: build-success
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        needs.build-success.result == 'success'
      }}
    steps:
      - name: "Merge Dependabot Pull Request automatically"
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}